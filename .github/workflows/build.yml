
name: Build FIN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/offline-sherpa-engine

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FIN source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Sherpa ONNX Android libraries
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar -xjf sherpa-onnx-v2.0.1-android.tar.bz2

      - name: Install Sherpa native libraries
        run: |
          mkdir -p app/src/main/jniLibs
          cp -R jniLibs/* app/src/main/jniLibs/

      - name: Install Sherpa Kotlin API
        run: |
          git clone --depth 1 --branch v2.0.1 \
            https://github.com/k2-fsa/sherpa-onnx.git \
            /tmp/sherpa-onnx

          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx

          cp /tmp/sherpa-onnx/sherpa-onnx/kotlin-api/*.kt \
            app/src/main/java/com/k2fsa/sherpa/onnx/

      - name: Download Bengali offline speech model
        run: |
          MODEL_DIR="sherpa-onnx-streaming-zipformer-bn-vosk-2026-02-09"

          wget -q \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${MODEL_DIR}.tar.bz2"

          tar -xjf "${MODEL_DIR}.tar.bz2"

          mkdir -p app/src/main/assets/${MODEL_DIR}

          cp ${MODEL_DIR}/encoder.onnx app/src/main/assets/${MODEL_DIR}/
          cp ${MODEL_DIR}/decoder.onnx app/src/main/assets/${MODEL_DIR}/
          cp ${MODEL_DIR}/joiner.onnx app/src/main/assets/${MODEL_DIR}/
          cp ${MODEL_DIR}/tokens.txt app/src/main/assets/${MODEL_DIR}/
          cp ${MODEL_DIR}/bpe.model app/src/main/assets/${MODEL_DIR}/

      - name: Verify offline model and native engine
        run: |
          test -s app/src/main/assets/sherpa-onnx-streaming-zipformer-bn-vosk-2026-02-09/encoder.onnx
          test -s app/src/main/assets/sherpa-onnx-streaming-zipformer-bn-vosk-2026-02-09/decoder.onnx
          test -s app/src/main/assets/sherpa-onnx-streaming-zipformer-bn-vosk-2026-02-09/joiner.onnx
          test -s app/src/main/assets/sherpa-onnx-streaming-zipformer-bn-vosk-2026-02-09/tokens.txt
          test -n "$(find app/src/main/jniLibs -name '*.so' -print -quit)"

      - name: Build FIN Debug APK
        run: gradle :app:assembleDebug

      - name: Upload FIN APK
        uses: actions/upload-artifact@v4
        with:
          name: FIN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
