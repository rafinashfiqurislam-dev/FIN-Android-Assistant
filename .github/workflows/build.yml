
name: Build FIN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/offline-sherpa-engine

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Sherpa-ONNX Android libraries
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar -xjf sherpa-onnx-v2.0.1-android.tar.bz2

      - name: Add native libraries to FIN
        run: |
          mkdir -p app/src/main/jniLibs
          cp -R jniLibs/* app/src/main/jniLibs/

          echo "Sherpa native libraries:"
          find app/src/main/jniLibs -type f

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
