
name: Build FIN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/offline-sherpa-engine

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FIN source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Sherpa ONNX Android libraries
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar -xjf sherpa-onnx-v2.0.1-android.tar.bz2

      - name: Add Sherpa native libraries
        run: |
          mkdir -p app/src/main/jniLibs
          cp -R jniLibs/* app/src/main/jniLibs/

          echo "Installed native libraries:"
          find app/src/main/jniLibs -type f

      - name: Download Sherpa Kotlin API
        run: |
          git clone \
            --depth 1 \
            --branch v2.0.1 \
            https://github.com/k2-fsa/sherpa-onnx.git \
            /tmp/sherpa-onnx

          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx

          cp /tmp/sherpa-onnx/sherpa-onnx/kotlin-api/*.kt \
            app/src/main/java/com/k2fsa/sherpa/onnx/

          echo "Installed Kotlin API files:"
          find app/src/main/java/com/k2fsa/sherpa/onnx -type f

      - name: Verify Sherpa integration files
        run: |
          test -d app/src/main/jniLibs
          test -n "$(find app/src/main/jniLibs -name '*.so' -print -quit)"
          test -n "$(find app/src/main/java/com/k2fsa/sherpa/onnx -name '*.kt' -print -quit)"

      - name: Build FIN Debug APK
        run: gradle :app:assembleDebug

      - name: Upload FIN APK
        uses: actions/upload-artifact@v4
        with:
          name: FIN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
